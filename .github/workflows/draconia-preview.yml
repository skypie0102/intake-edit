name: Draconia preview APK

on:
  push:
    branches: [preview/draconia-companion]
    paths:
      - 'app/**'
      - 'rig-preview/draconia/**'
      - '.github/workflows/draconia-preview.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Test and build preview
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: draconia-preview-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
