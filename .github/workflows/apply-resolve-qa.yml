name: Apply Resolve QA

on:
  push:
    branches: [feature/resolve-qa-findings]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply UI patch and compile fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          # Reuse the already-reviewed source patch from the first helper.
          workflow = Path('.github/workflows/patch-resolve-qa.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          body = workflow[start:end]
          body = "\n".join(line[10:] if line.startswith("          ") else line for line in body.splitlines())
          exec(compile(body, '<resolve-qa-patch>', 'exec'))

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing patch target in {path}: {old!r}")
              p.write_text(text.replace(old, new, count))

          replace(
              'app/src/main/java/cloud/shadowmonarchbooks/intakeedit/EditorScreen.kt',
              'current.qa?.document?.active(editorContentSha).orEmpty()',
              'current.qa?.document?.active(current.document, editorContentSha).orEmpty()',
          )

          replace(
              'app/src/main/java/cloud/shadowmonarchbooks/intakeedit/QaFindings.kt',
              '''        val currentLocators = findings.map { it.locator }.filter { it.isNotBlank() }.distinct().sorted()\n        if (currentLocators != pass.mutableLocators.sorted()) return false\n        return QaFindingsParser.protectedContentSha256(editor, currentLocators.toSet()) == pass.protectedContentSha256''',
              '''        val mutableLocators = if (findings.any { it.locator.isBlank() }) {\n            editor.entries.map { it.locator }.sorted()\n        } else {\n            findings.map { it.locator }.filter { it.isNotBlank() }.distinct().sorted()\n        }\n        if (mutableLocators != pass.mutableLocators.sorted()) return false\n        return QaFindingsParser.protectedContentSha256(editor, mutableLocators.toSet()) == pass.protectedContentSha256''',
          )

          help_path = 'app/src/main/java/cloud/shadowmonarchbooks/intakeedit/HelpScreen.kt'
          replace(
              help_path,
              '                    Text("Pending QA → materialize reader output → full semantic QA → one of two outcomes:")',
              '                    Text("Pending QA → one full semantic QA pass. After that, the recorded pass is reused while you address only the flagged paragraphs:")',
          )
          replace(
              help_path,
              '                    HelpLine("No active findings", "The chapter becomes Approved.")',
              '                    HelpLine("No findings", "The chapter can go straight through deterministic materialization/validation to Approved.")',
          )
          replace(
              help_path,
              '                    HelpLine("Any active finding", "The chapter automatically returns to Pending Review. This includes warnings, errors, and blockers.")',
              '                    HelpLine("Any finding", "The chapter returns to Pending Review. Correct it and press Resolve, or press Override when the finding allows it.")',
          )
          replace(
              help_path,
              '                    Text("After a return, cards needing attention show a ! button. It combines active QA findings and endnote suggestions in one sheet; the bottom ! button cycles through cards with unresolved attention. Fix the text/endnote or override an eligible finding, then Tag for QA & Commit again.")',
              '                    Text("After a return, cards needing attention show a ! button. It combines active QA findings and endnote suggestions. Resolve requires that the flagged paragraph was actually changed. Override means you intentionally accept it as-is and requires a reason when allowed. Once every QA finding is closed, the main action becomes Finalize & Commit; semantic QA does not run again.")',
          )
          replace(
              help_path,
              '''                HelpCard("Overrides") {\n                    Text("A finding can be overridden only when it is marked overrideable. The app requires a reason and keeps the override as an audit record.")\n                    Text("Overrides are bound to the authoritative English/endnote content. Editing that content makes an old override stale and the finding active again.")\n                    Text("Moving between Pending Review and Pending QA by itself does not stale an override.")\n                }''',
              '''                HelpCard("Resolve and Override") {\n                    HelpLine("Resolve", "Use this after correcting the flagged paragraph. Resolve is accepted only when that paragraph differs from the QA-reviewed baseline.")\n                    HelpLine("Override", "Use this when you intentionally accept the finding as-is. It is available only when the finding is overrideable and requires a reason.")\n                    Text("Both are paragraph-scoped audit records. Editing that same paragraph again makes its closure stale; editing another flagged paragraph does not.")\n                    Text("If you edit a paragraph that QA did not flag, or other protected chapter content, the recorded QA pass becomes stale and a fresh semantic QA pass is required.")\n                }''',
          )
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Test and build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Commit source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app
          git commit -m 'ui: add Resolve and one-pass QA finalization'
          git push
