name: Token safety patch

on:
  push:
    branches: [fix/github-token-reuse-guard]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/github-token-reuse-guard
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-read-only: true
      - name: Apply patch
        run: python tools/apply_token_guard.py
      - name: Unit tests and debug build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Commit generated app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts app/src/main/java app/src/test/java
          git diff --cached --quiet && exit 0
          git commit -m "security: block accidental GitHub credential commits"
          git push origin HEAD:fix/github-token-reuse-guard
