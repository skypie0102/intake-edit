name: Clean recovered build outputs
on:
  push:
    branches: [recovery/v0.5.1-parity]
    paths:
      - '.github/workflows/cleanup-generated.yml'
      - '.gitignore'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/v0.5.1-parity
          fetch-depth: 0
      - name: Remove accidentally tracked generated files
        run: |
          git rm -r --ignore-unmatch .gradle app/build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Verify clean source still passes tests and build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Commit cleanup
        run: |
          rm -f .github/workflows/cleanup-generated.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove generated Android build outputs'
          git push origin HEAD:recovery/v0.5.1-parity
