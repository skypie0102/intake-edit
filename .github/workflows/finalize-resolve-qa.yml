name: Finalize Resolve QA

on:
  push:
    branches: [feature/resolve-qa-findings]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Final wording cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/cloud/shadowmonarchbooks/intakeedit/EditorScreen.kt')
          text = path.read_text()
          old = 'Text("Confirm override")'
          if text.count(old) != 1:
              raise SystemExit(f'expected one remaining confirm override label, found {text.count(old)}')
          path.write_text(text.replace(old, 'Text("Override")'))
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Commit wording
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/cloud/shadowmonarchbooks/intakeedit/EditorScreen.kt
          git commit -m 'ui: simplify QA action button labels'
          git push
