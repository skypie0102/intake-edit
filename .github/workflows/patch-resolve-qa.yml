name: Patch Resolve QA UI

on:
  push:
    branches: [feature/resolve-qa-findings]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source patches
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=-1):
              p = Path(path)
              text = p.read_text()
              hits = text.count(old)
              if hits == 0:
                  raise SystemExit(f"missing patch target in {path}: {old[:120]!r}")
              if count >= 0 and hits < count:
                  raise SystemExit(f"expected at least {count} targets in {path}, found {hits}")
              text = text.replace(old, new, count if count >= 0 else -1)
              p.write_text(text)

          replace(
              'app/src/main/java/cloud/shadowmonarchbooks/intakeedit/QaFindings.kt',
              '.map(::endnoteMap)\n            .toMutableList<Any>()',
              '.map { endnoteMap(it) as Any }\n            .toMutableList()',
              1,
          )
          replace(
              'app/src/main/java/cloud/shadowmonarchbooks/intakeedit/ChapterListViewModel.kt',
              'repository.loadQaCounts(file, loaded.editorContentSha256)',
              'repository.loadQaCounts(file, loaded.document, loaded.editorContentSha256)',
              1,
          )
          replace(
              'app/src/main/java/cloud/shadowmonarchbooks/intakeedit/MainActivity.kt',
              '''            onOverride = { next, findingId, reason ->\n                editorViewModel.overrideQa(next, findingId, reason, settings, token)\n            },''',
              '''            onOverride = { next, findingId, reason ->\n                editorViewModel.overrideQa(next, findingId, reason, settings, token)\n            },\n            onResolve = { next, findingId ->\n                editorViewModel.resolveQa(next, findingId, settings, token)\n            },''',
              1,
          )

          editor = 'app/src/main/java/cloud/shadowmonarchbooks/intakeedit/EditorScreen.kt'
          replace(editor, '    onOverride: (OpenChapter, String, String) -> Unit,\n) {', '    onOverride: (OpenChapter, String, String) -> Unit,\n    onResolve: (OpenChapter, String) -> Unit,\n) {', 1)
          replace(editor, 'current.qa?.document?.active(editorSha).orEmpty()', 'current.qa?.document?.active(current.document, editorSha).orEmpty()')
          replace(
              editor,
              '''                    QaFindingsView(\n                        snapshot = current.qa,\n                        editorSha = QaFindingsParser.editorContentSha256(current.raw),\n                        busy = busy,\n                        onOverride = { id, reason -> onOverride(current, id, reason) },''',
              '''                    QaFindingsView(\n                        snapshot = current.qa,\n                        editor = current.document,\n                        editorSha = QaFindingsParser.editorContentSha256(current.raw),\n                        busy = busy,\n                        onOverride = { id, reason -> onOverride(current, id, reason) },\n                        onResolve = { id -> onResolve(current, id) },''',
              1,
          )
          replace(editor, '                                onOverrideFinding = { id, reason -> onOverride(current, id, reason) },', '                                onOverrideFinding = { id, reason -> onOverride(current, id, reason) },\n                                onResolveFinding = { id -> onResolve(current, id) },', 1)
          replace(editor, '    onOverrideFinding: (String, String) -> Unit,\n    onRestoreEditState:', '    onOverrideFinding: (String, String) -> Unit,\n    onResolveFinding: (String) -> Unit,\n    onRestoreEditState:', 1)
          replace(
              editor,
              '''                                if (finding.overridable) {\n                                    TextButton(onClick = {\n                                        pendingQaOverride = finding\n                                        qaOverrideReason = ""\n                                    }) { Text("Override finding") }\n                                }''',
              '''                                Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {\n                                    TextButton(onClick = { onResolveFinding(finding.id) }) { Text("Resolve") }\n                                    if (finding.overridable) {\n                                        TextButton(onClick = {\n                                            pendingQaOverride = finding\n                                            qaOverrideReason = ""\n                                        }) { Text("Override") }\n                                    }\n                                }''',
              1,
          )
          replace(editor, '                ) { Text("Confirm override") }', '                ) { Text("Override") }', 1)
          replace(
              editor,
              '''private fun QaFindingsView(\n    snapshot: QaFindingsSnapshot?,\n    editorSha: String,\n    busy: Boolean,\n    onOverride: (String, String) -> Unit,\n    onShowParagraph: (String) -> Unit,''',
              '''private fun QaFindingsView(\n    snapshot: QaFindingsSnapshot?,\n    editor: EditorDocument,\n    editorSha: String,\n    busy: Boolean,\n    onOverride: (String, String) -> Unit,\n    onResolve: (String) -> Unit,\n    onShowParagraph: (String) -> Unit,''',
              1,
          )
          replace(editor, '            val overridden = finding.override?.editorContentSha256 == editorSha', '            val disposition = snapshot.document.disposition(finding, editor, editorSha)', 1)
          replace(
              editor,
              '                    Text(if (overridden) "OVERRIDDEN" else if (finding.override != null) "ACTIVE • old override stale" else "ACTIVE")',
              '''                    Text(\n                        when (disposition) {\n                            QaFindingDisposition.RESOLVED -> "RESOLVED"\n                            QaFindingDisposition.OVERRIDDEN -> "OVERRIDDEN"\n                            QaFindingDisposition.ACTIVE -> if (finding.resolution != null || finding.override != null) "ACTIVE • previous closure stale" else "ACTIVE"\n                        },\n                    )''',
              1,
          )
          replace(
              editor,
              '''                    Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {\n                        if (finding.locator.isNotBlank()) TextButton(onClick = { onShowParagraph(finding.locator) }, enabled = !busy) { Text("Show paragraph") }\n                        if (finding.overridable) TextButton(onClick = { pending = finding }, enabled = !busy && !overridden) { Text("Override finding") }\n                    }''',
              '''                    Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {\n                        if (finding.locator.isNotBlank()) TextButton(onClick = { onShowParagraph(finding.locator) }, enabled = !busy) { Text("Show paragraph") }\n                        if (disposition == QaFindingDisposition.ACTIVE) {\n                            TextButton(onClick = { onResolve(finding.id) }, enabled = !busy) { Text("Resolve") }\n                            if (finding.overridable) TextButton(onClick = { pending = finding }, enabled = !busy) { Text("Override") }\n                        }\n                    }''',
              1,
          )
          replace(
              editor,
              '    val hasLocalChanges = current.raw != current.remote.content || current.endnoteProposals?.changed == true',
              '''    val hasLocalChanges = current.raw != current.remote.content || current.endnoteProposals?.changed == true\n    val qaPassReusable = current.qa?.document?.qaPassReusable(current.document) == true\n    val qaPassStale = current.qa?.document?.qaPass != null && !qaPassReusable\n    val finalizingExistingQaPass = qaPassReusable && current.qa?.document?.active(current.document, editorContentSha).orEmpty().isEmpty()\n    val primaryCommitLabel = if (finalizingExistingQaPass) "Finalize & Commit" else "Tag for QA & Commit"''',
              1,
          )
          replace(editor, '            editorNotice?.let { Text(it, style = MaterialTheme.typography.bodySmall) }', '            editorNotice?.let { Text(it, style = MaterialTheme.typography.bodySmall) }\n            if (qaPassStale) {\n                Text("Previous QA pass is stale because protected/unflagged content changed. Fresh semantic QA is required.", style = MaterialTheme.typography.bodySmall)\n            }', 1)
          replace(editor, 'Button(onClick = { showCommit = true }, enabled = !busy && !importBusy) { Text("Tag for QA & Commit") }', 'Button(onClick = { showCommit = true }, enabled = !busy && !importBusy) { Text(primaryCommitLabel) }', 1)
          replace(
              editor,
              '''                        append("Tag for QA only after checking the full chapter. Tagging moves the chapter to Pending QA, where full semantic QA can process it. Every English field must be supplied first. Any QA finding will return it to Pending Review. Imported translations stay local until you use them; Fill blanks and Use Import copy them into authoritative English fields.")''',
              '''                        if (finalizingExistingQaPass) {\n                            append("All findings from the recorded semantic QA pass are closed. Finalize commits the corrected/accepted chapter for deterministic materialization and approval without running semantic QA again. If protected or unflagged content changed, finalization will refuse and require fresh QA.")\n                        } else {\n                            append("Tag for QA only after checking the full chapter. Tagging moves the chapter to Pending QA for one full semantic QA pass. Every English field must be supplied first. Any QA finding returns it to Pending Review for Resolve or Override.")\n                        }''',
              1,
          )
          replace(editor, '{ Text("Tag for QA & Commit") } },\n            dismissButton', '{ Text(primaryCommitLabel) } },\n            dismissButton', 1)

          evm = 'app/src/test/java/cloud/shadowmonarchbooks/intakeedit/EditorViewModelTest.kt'
          replace(evm, 'override suspend fun loadQaCounts(file: ChapterFile, editorContentSha256: String): QaProgressCounts = error("Not used in this test")', 'override suspend fun loadQaCounts(file: ChapterFile, document: EditorDocument, editorContentSha256: String): QaProgressCounts = error("Not used in this test")', 1)
          replace(evm, '    override suspend fun overrideQa(chapter: OpenChapter, findingId: String, reason: String): OpenChapter = error("Not used in this test")', '    override suspend fun overrideQa(chapter: OpenChapter, findingId: String, reason: String): OpenChapter = error("Not used in this test")\n    override suspend fun resolveQa(chapter: OpenChapter, findingId: String): OpenChapter = error("Not used in this test")', 1)

          test = 'app/src/test/java/cloud/shadowmonarchbooks/intakeedit/ChapterListViewModelTest.kt'
          replace(
              test,
              '''        LoadedChapterProgress(\n            progress = requireNotNull(progress[file.path]),\n            editorContentSha256 = "editor-sha-${file.chapter}",\n        )''',
              '''        LoadedChapterProgress(\n            progress = requireNotNull(progress[file.path]),\n            editorContentSha256 = "editor-sha-${file.chapter}",\n            document = EditorDocument(\n                schemaVersion = 6, volume = file.volume, chapter = file.chapter,\n                sourceHref = "source.xhtml", sourceSha256 = "source-sha", readerFile = "reader.xhtml",\n                englishTitle = "Chapter ${file.chapter}", instructions = "", editorReviewComplete = false, entries = emptyList(),\n            ),\n        )''',
              1,
          )
          replace(test, 'override suspend fun loadQaCounts(file: ChapterFile, editorContentSha256: String): QaProgressCounts {', 'override suspend fun loadQaCounts(file: ChapterFile, document: EditorDocument, editorContentSha256: String): QaProgressCounts {', 1)
          replace(test, 'override suspend fun loadQaCounts(file: ChapterFile, editorContentSha256: String): QaProgressCounts = error("Not used in this test")', 'override suspend fun loadQaCounts(file: ChapterFile, document: EditorDocument, editorContentSha256: String): QaProgressCounts = error("Not used in this test")', 1)
          text = Path(test).read_text()
          text = text.replace(
              '    override suspend fun overrideQa(chapter: OpenChapter, findingId: String, reason: String): OpenChapter = error("Not used in this test")',
              '    override suspend fun overrideQa(chapter: OpenChapter, findingId: String, reason: String): OpenChapter = error("Not used in this test")\n    override suspend fun resolveQa(chapter: OpenChapter, findingId: String): OpenChapter = error("Not used in this test")',
          )
          Path(test).write_text(text)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Test and build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Commit patches
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app
          git commit -m 'ui: add Resolve to QA attention workflow'
          git push
