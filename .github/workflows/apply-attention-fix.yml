name: Apply attention UI fix

on:
  push:
    branches: [fix/attention-badge-semantics]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch editor UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/cloud/shadowmonarchbooks/intakeedit/EditorScreen.kt')
          text = path.read_text()

          def sub(pattern, replacement, label):
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')

          sub(
              r'    fun cycleAttention\(\) \{.*?^    \}\n\n    val missingEnglish',
              '''    fun cycleAttention() {
        val editorSha = QaFindingsParser.editorContentSha256(current.raw)
        val attention = buildAttentionState(
            document = current.document,
            qa = current.qa?.document,
            proposals = current.endnoteProposals?.document,
            volume = current.file.volume,
            chapter = current.file.chapter,
            editorContentSha256 = editorSha,
        )
        val targets = attention.unresolvedLocators
        if (targets.isEmpty()) {
            if (attention.hasUnlocatedActiveQa) {
                focusManager.clearFocus(force = true)
                showWholeFile = false
                showQa = true
                filter = EntryFilter.ALL
            }
            return
        }
        val currentIndex = targets.indexOf(lastAttentionLocator)
        val target = targets[if (currentIndex < 0 || currentIndex == targets.lastIndex) 0 else currentIndex + 1]
        focusManager.clearFocus(force = true)
        showQa = false
        showWholeFile = false
        filter = EntryFilter.ALL
        lastAttentionLocator = target
        jumpLocator = target
        jumpRequestId += 1
    }

    val missingEnglish''',
              'cycleAttention',
          )

          sub(
              r'    val missingEnglish = current\.document\.entries\.filterNot \{ it\.isSupplied \}\n.*?^    val suppliedEnglishCount',
              '''    val missingEnglish = current.document.entries.filterNot { it.isSupplied }
    val editorContentSha = QaFindingsParser.editorContentSha256(current.raw)
    val attentionState = buildAttentionState(
        document = current.document,
        qa = current.qa?.document,
        proposals = current.endnoteProposals?.document,
        volume = current.file.volume,
        chapter = current.file.chapter,
        editorContentSha256 = editorContentSha,
    )
    val allQaByLocator = attentionState.allQaByLocator
    val qaDispositionById = attentionState.qaDispositionById
    val unresolvedAttentionCount = attentionState.unresolvedCount
    val suppliedEnglishCount''',
              'attention summary',
          )

          old = 'qaFindings = activeQaByLocator[entry.locator].orEmpty(),'
          if text.count(old) != 1:
              raise SystemExit(f'entry QA binding: expected one match, found {text.count(old)}')
          text = text.replace(
              old,
              'qaFindings = allQaByLocator[entry.locator].orEmpty(),\n                                qaDispositionById = qaDispositionById,',
              1,
          )

          old = 'badge = { Badge { Text(missingEnglish.size.toString()) } },'
          if text.count(old) != 1:
              raise SystemExit(f'missing-English badge: expected one match, found {text.count(old)}')
          text = text.replace(
              old,
              'badge = { if (missingEnglish.isNotEmpty()) Badge { Text(missingEnglish.size.toString()) } },',
              1,
          )

          old = '''badge = { Badge { Text(attentionLocators.size.toString()) } },'''
          if text.count(old) != 1:
              raise SystemExit(f'attention badge: expected one match, found {text.count(old)}')
          text = text.replace(
              old,
              'badge = { if (unresolvedAttentionCount > 0) Badge { Text(unresolvedAttentionCount.toString()) } },',
              1,
          )
          old = 'enabled = !busy && attentionLocators.isNotEmpty(),'
          if text.count(old) != 1:
              raise SystemExit(f'attention enablement: expected one match, found {text.count(old)}')
          text = text.replace(old, 'enabled = !busy && unresolvedAttentionCount > 0,', 1)

          old = '''    proposals: List<EndnoteProposal>,
    qaFindings: List<QaFinding>,
    importedTranslation: String?,'''
          if text.count(old) != 1:
              raise SystemExit(f'EntryCard signature: expected one match, found {text.count(old)}')
          text = text.replace(
              old,
              '''    proposals: List<EndnoteProposal>,
    qaFindings: List<QaFinding>,
    qaDispositionById: Map<String, QaFindingDisposition>,
    importedTranslation: String?,''',
              1,
          )

          old = '    val activeAttentionCount = qaFindings.size + proposals.count { it.status == "pending" }'
          if text.count(old) != 1:
              raise SystemExit(f'card count: expected one match, found {text.count(old)}')
          text = text.replace(
              old,
              '''    val activeAttentionCount =
        qaFindings.count { qaDispositionById[it.id] == QaFindingDisposition.ACTIVE } +
            proposals.count { (localProposalStatuses[it.id] ?: it.status) == "pending" }''',
              1,
          )

          old = '''                    qaFindings.forEach { finding ->
                        Card(Modifier.fillMaxWidth()) {
                            Column(Modifier.padding(10.dp), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                                Text("${finding.severity.uppercase()} • ${finding.category}", fontWeight = FontWeight.Bold)
                                Text(finding.message)
                                Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                    TextButton(onClick = { onResolveFinding(finding.id) }) { Text("Resolve") }
                                    if (finding.overridable) {
                                        TextButton(onClick = {
                                            pendingQaOverride = finding
                                            qaOverrideReason = ""
                                        }) { Text("Override") }
                                    }
                                }
                            }
                        }
                    }'''
          if text.count(old) != 1:
              raise SystemExit(f'QA attention cards: expected one match, found {text.count(old)}')
          text = text.replace(
              old,
              '''                    qaFindings.forEach { finding ->
                        val disposition = qaDispositionById[finding.id] ?: QaFindingDisposition.ACTIVE
                        Card(Modifier.fillMaxWidth()) {
                            Column(Modifier.padding(10.dp), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                                Text("${finding.severity.uppercase()} • ${finding.category}", fontWeight = FontWeight.Bold)
                                Text(finding.message)
                                Text(
                                    when (disposition) {
                                        QaFindingDisposition.RESOLVED -> "RESOLVED"
                                        QaFindingDisposition.OVERRIDDEN -> "OVERRIDDEN"
                                        QaFindingDisposition.ACTIVE -> if (finding.resolution != null || finding.override != null) "ACTIVE • previous closure stale" else "ACTIVE"
                                    },
                                    style = MaterialTheme.typography.labelMedium,
                                )
                                if (disposition == QaFindingDisposition.ACTIVE) {
                                    Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                        TextButton(onClick = { onResolveFinding(finding.id) }) { Text("Resolve") }
                                        if (finding.overridable) {
                                            TextButton(onClick = {
                                                pendingQaOverride = finding
                                                qaOverrideReason = ""
                                            }) { Text("Override") }
                                        }
                                    }
                                }
                            }
                        }
                    }''',
              1,
          )

          old = '''                    proposals.forEach { proposal ->
                        Card(Modifier.fillMaxWidth()) {
                            Column(Modifier.padding(10.dp), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                                if (proposal.status == "accepted") {
                                    Text("Used suggestion", style = MaterialTheme.typography.labelMedium, fontWeight = FontWeight.SemiBold)
                                }'''
          if text.count(old) != 1:
              raise SystemExit(f'endnote attention cards: expected one match, found {text.count(old)}')
          text = text.replace(
              old,
              '''                    proposals.forEach { proposal ->
                        val proposalStatus = localProposalStatuses[proposal.id] ?: proposal.status
                        Card(Modifier.fillMaxWidth()) {
                            Column(Modifier.padding(10.dp), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                                when (proposalStatus) {
                                    "accepted" -> Text("Used suggestion", style = MaterialTheme.typography.labelMedium, fontWeight = FontWeight.SemiBold)
                                    "rejected" -> Text("Dismissed suggestion", style = MaterialTheme.typography.labelMedium, fontWeight = FontWeight.SemiBold)
                                }''',
              1,
          )
          old = 'Text(if (proposal.status == "accepted") "Use again" else "Use suggestion")'
          if text.count(old) != 1:
              raise SystemExit(f'endnote action label: expected one match, found {text.count(old)}')
          text = text.replace(old, 'Text(if (proposalStatus == "accepted") "Use again" else "Use suggestion")', 1)

          path.write_text(text)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Commit UI changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/cloud/shadowmonarchbooks/intakeedit/EditorScreen.kt
          git commit -m 'ui: fix attention badge counting and history visibility'
          git push
