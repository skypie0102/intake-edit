name: Android emulator checks

on:
  pull_request:
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-emulator.yml'
  workflow_dispatch:

concurrency:
  group: android-emulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest
            adb logcat -d -s IntakeQaBenchmark:I '*:S'
            gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=cloud.shadowmonarchbooks.intakeedit.DraftProcessRestartAndroidTest -Pandroid.testInstrumentationRunnerArguments.draft_phase=write
            adb shell am force-stop cloud.shadowmonarchbooks.intakeedit.rigpreview
            gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=cloud.shadowmonarchbooks.intakeedit.DraftProcessRestartAndroidTest -Pandroid.testInstrumentationRunnerArguments.draft_phase=verify
