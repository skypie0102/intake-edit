name: Publish Intake Edit v0.6.1 Once

on:
  push:
    paths:
      - '.github/workflows/publish-v061-once.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: v0.6.1
      RELEASE_VERSION: 0.6.1
      INTAKE_EDIT_KEYSTORE_PATH: ${{ github.workspace }}/release-signing.jks

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify app version
        shell: bash
        run: |
          grep -q 'versionCode = 17' app/build.gradle.kts
          grep -q 'versionName = "0.6.1"' app/build.gradle.kts

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$SECRET_KEYSTORE_PASSWORD" ] && [ -n "$SECRET_KEY_ALIAS" ] && [ -n "$SECRET_KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$INTAKE_EDIT_KEYSTORE_PATH"
            echo "INTAKE_EDIT_KEYSTORE_PASSWORD=$SECRET_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "INTAKE_EDIT_KEY_ALIAS=$SECRET_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "INTAKE_EDIT_KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=repository-secret" >> "$GITHUB_ENV"
          else
            TEMP_PASSWORD='intake-edit-oneoff'
            TEMP_ALIAS='intake-edit-oneoff'
            keytool -genkeypair -keystore "$INTAKE_EDIT_KEYSTORE_PATH" -storepass "$TEMP_PASSWORD" -keypass "$TEMP_PASSWORD" -alias "$TEMP_ALIAS" -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Intake Edit ${RELEASE_TAG} One-Off Release, O=Shadow Monarch Books, C=PH"
            echo "INTAKE_EDIT_KEYSTORE_PASSWORD=$TEMP_PASSWORD" >> "$GITHUB_ENV"
            echo "INTAKE_EDIT_KEY_ALIAS=$TEMP_ALIAS" >> "$GITHUB_ENV"
            echo "INTAKE_EDIT_KEY_PASSWORD=$TEMP_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=one-off-fallback" >> "$GITHUB_ENV"
          fi

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Run unit tests and build signed release APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Verify, name, and checksum APK
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APK"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          cp "$APK" "intake-edit-${RELEASE_TAG}.apk"
          sha256sum "intake-edit-${RELEASE_TAG}.apk" > "intake-edit-${RELEASE_TAG}.apk.sha256"
          echo "Built ${RELEASE_TAG} using signing mode: ${SIGNING_MODE}"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: intake-edit-v0.6.1-release-apk
          path: |
            intake-edit-v0.6.1.apk
            intake-edit-v0.6.1.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.1
          target_commitish: ${{ github.sha }}
          name: Intake Edit v0.6.1
          generate_release_notes: true
          body: |
            Intake Edit v0.6.1 Android release.

            Version code: 17
            Version name: 0.6.1
            Signing mode: ${{ env.SIGNING_MODE }}
          files: |
            intake-edit-v0.6.1.apk
            intake-edit-v0.6.1.apk.sha256

      - name: Remove one-shot release workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-v061-once.yml
          git commit -m 'Remove one-shot v0.6.1 release workflow'
          git push
