name: Restore exact APK icon
on:
  push:
    branches: [recovery/v0.5.1-parity]
    paths:
      - 'tmp/icon_exact_mdpi.b64'
      - '.github/workflows/restore-icon.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/v0.5.1-parity
          fetch-depth: 0
      - name: Restore exact launcher icon
        run: |
          mkdir -p app/src/main/res/drawable
          base64 -d tmp/icon_exact_mdpi.b64 > app/src/main/res/drawable/intake_edit_icon.png
          echo '5306d4a6b58cc30675b2f19bb9d1b366eb4ce02082a2c0c9659c2c676a035f6a  app/src/main/res/drawable/intake_edit_icon.png' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/AndroidManifest.xml')
          s = p.read_text()
          needle = '    <application\n        android:allowBackup="true"\n'
          repl = '    <application\n        android:allowBackup="true"\n        android:icon="@drawable/intake_edit_icon"\n        android:roundIcon="@drawable/intake_edit_icon"\n'
          if 'android:icon="@drawable/intake_edit_icon"' not in s:
              if needle not in s:
                  raise SystemExit('manifest application block not found')
              s = s.replace(needle, repl, 1)
          p.write_text(s)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Test and build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Commit exact icon and cleanup staging
        run: |
          rm -f tmp/icon_exact_mdpi.b64 tmp/restore-icon.yml .github/workflows/restore-icon.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore exact APK launcher icon'
          git push origin HEAD:recovery/v0.5.1-parity
