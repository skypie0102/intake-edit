name: Apply glossary bulk UI patch

on:
  push:
    paths:
      - 'scripts/apply_glossary_bulk_ui.py'
      - '.github/workflows/apply-glossary-bulk-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Apply patch
        run: python scripts/apply_glossary_bulk_ui.py
      - name: Test and build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Commit finished app changes and remove one-shot patcher
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/apply_glossary_bulk_ui.py .github/workflows/apply-glossary-bulk-ui.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No patch changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Glossary: bulk approval and locked QA filter'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
