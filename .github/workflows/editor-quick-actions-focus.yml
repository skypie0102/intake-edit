name: Editor quick actions focus

on:
  push:
    branches: [fix/editor-quick-actions-focus]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/editor-quick-actions-focus
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-read-only: true
      - name: Apply focus patch
        run: python tools/apply_editor_quick_action_focus.py
      - name: Unit tests and debug build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Commit generated app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts app/src/main/java
          git diff --cached --quiet && exit 0
          git commit -m "fix: decouple editor quick actions from keyboard focus"
          git push origin HEAD:fix/editor-quick-actions-focus
