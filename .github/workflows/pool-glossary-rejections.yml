name: Pool glossary rejections

on:
  push:
    branches:
      - feature/pool-glossary-rejections
    paths:
      - '.github/workflows/pool-glossary-rejections.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pool-glossary-rejections
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Apply pooled rejection workflow
        run: |
          printf '%s' '' | base64 --decode > /tmp/apply.py
          python /tmp/apply.py
      - name: Test and build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/cloud/shadowmonarchbooks/intakeedit/GlossaryActions.kt \
                  app/src/main/java/cloud/shadowmonarchbooks/intakeedit/GlossaryRepository.kt \
                  app/src/main/java/cloud/shadowmonarchbooks/intakeedit/GlossaryViewModel.kt \
                  app/src/main/java/cloud/shadowmonarchbooks/intakeedit/GlossaryWorkspaceScreen.kt \
                  app/src/test/java/cloud/shadowmonarchbooks/intakeedit/GlossaryViewModelTest.kt \
                  app/src/test/java/cloud/shadowmonarchbooks/intakeedit/GlossaryActionsTest.kt \
                  app/build.gradle.kts
          git commit -m "glossary: pool suggestion rejections"
          git push origin HEAD:feature/pool-glossary-rejections
