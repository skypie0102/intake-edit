          )
          s = s.replace(
              '    var lastApprovalDrafts: Map<String, GlossaryEntry> = emptyMap()\n',
              '    var lastApprovalDrafts: Map<String, GlossaryEntry> = emptyMap()\n    var lastRejectionDraftIds: Set<String> = emptySet()\n',
          )
          anchor = '''    override suspend fun approveAllSuggestions(
        state: GlossarySnapshot,
        approvalDrafts: Map<String, GlossaryEntry>,
    ) {
'''
