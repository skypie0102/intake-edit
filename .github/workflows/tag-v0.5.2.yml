name: Tag v0.5.2
on:
  push:
    branches: [release/v0.5.2]
    paths:
      - '.github/workflows/tag-v0.5.2.yml'
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create validated release tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag v0.5.2 817eb8b31db17b96207483ac551431e47e2e557e
          git push origin refs/tags/v0.5.2
