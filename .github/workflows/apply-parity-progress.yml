name: Apply parity progress patch

on:
  push:
    branches:
      - recovery/v0.5.1-parity

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/v0.5.1-parity
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Apply parity patch
        run: python tmp/apply-parity-progress.py
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Commit production changes and clean helpers
        shell: bash
        run: |
          rm -f tmp/apply-parity-progress.py .github/workflows/apply-parity-progress.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore chapter progress and completion parity'
          git push origin HEAD:recovery/v0.5.1-parity
