name: Apply copy suggestion patch

on:
  push:
    branches:
      - feature/copy-suggestion-note

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/copy-suggestion-note
      - name: Apply UI and version patch
        shell: python
        run: |
          from pathlib import Path

          editor = Path("app/src/main/java/cloud/shadowmonarchbooks/intakeedit/EditorScreen.kt")
          text = editor.read_text()
          old = '''                            Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                Button(onClick = { openSuggestion(proposal) }) {
                                    Text(if (proposal.status == "accepted") "Use again" else "Use suggestion")
                                }
                                TextButton(
                                    onClick = {
                                        onProposalDecision(proposal.id, "rejected")
                                        if (proposals.size == 1) showProposalSheet = false
                                    },
                                ) { Text("Dismiss") }
                            }
'''
          new = '''                            Row(
                                horizontalArrangement = Arrangement.spacedBy(6.dp),
                                verticalAlignment = Alignment.CenterVertically,
                            ) {
                                Button(onClick = { openSuggestion(proposal) }) {
                                    Text(if (proposal.status == "accepted") "Use again" else "Use suggestion")
                                }
                                TextButton(
                                    onClick = {
                                        onProposalDecision(proposal.id, "rejected")
                                        if (proposals.size == 1) showProposalSheet = false
                                    },
                                ) { Text("Dismiss") }
                                IconButton(
                                    onClick = {
                                        clipboard.setPrimaryClip(
                                            ClipData.newPlainText("Suggested endnote", proposal.suggestedContent),
                                        )
                                        Toast.makeText(context, "Suggestion note copied.", Toast.LENGTH_SHORT).show()
                                    },
                                    enabled = proposal.suggestedContent.isNotBlank(),
                                ) {
                                    Icon(Icons.Default.ContentCopy, "Copy suggested note")
                                }
                            }
'''
          if old not in text:
              raise SystemExit("Suggestion action row not found")
          editor.write_text(text.replace(old, new, 1))

          gradle = Path("app/build.gradle.kts")
          build = gradle.read_text()
          build = build.replace('versionCode = 30', 'versionCode = 31', 1)
          build = build.replace('versionName = "0.11.0"', 'versionName = "0.11.1"', 1)
          gradle.write_text(build)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/cloud/shadowmonarchbooks/intakeedit/EditorScreen.kt app/build.gradle.kts
          git commit -m "Add copy button for endnote suggestion note"
          git push origin HEAD:feature/copy-suggestion-note
