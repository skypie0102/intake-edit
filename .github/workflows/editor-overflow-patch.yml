name: Editor overflow patch

on:
  push:
    branches: [fix/editor-overflow-commit-in-place]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/editor-overflow-commit-in-place
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-read-only: true
      - name: Apply patch
        run: python tools/apply_editor_overflow_patch.py
      - name: Unit tests and debug build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Commit generated app changes
        run: |
          git config user.name 'skypie0102'
          git config user.email 'skypirate1202@gmail.com'
          git add app
          git diff --cached --quiet && exit 0
          git commit -m 'Improve editor overflow and in-place commit'
          git push origin HEAD:fix/editor-overflow-commit-in-place
