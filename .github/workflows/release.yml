name: Publish Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Optional release tag override (for example v0.7.0)
        required: false
        type: string

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INTAKE_EDIT_KEYSTORE_PATH: ${{ github.workspace }}/release-signing.jks

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Resolve and validate release version
        id: release_version
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)"
          APP_VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$APP_VERSION"
          test -n "$APP_VERSION_CODE"
          if [ -n "$REQUESTED_TAG" ]; then
            RELEASE_TAG="$REQUESTED_TAG"
          else
            RELEASE_TAG="v$APP_VERSION"
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [ "${RELEASE_TAG#v}" != "$APP_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match app versionName $APP_VERSION" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$APP_VERSION_CODE" >> "$GITHUB_ENV"
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            echo "$RELEASE_TAG already exists; no release needed."
          else
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
            echo "Preparing $RELEASE_TAG from $GITHUB_SHA."
          fi
      - name: Prepare release signing
        if: steps.release_version.outputs.release_needed == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$SECRET_KEYSTORE_PASSWORD" ] && [ -n "$SECRET_KEY_ALIAS" ] && [ -n "$SECRET_KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$INTAKE_EDIT_KEYSTORE_PATH"
            echo "INTAKE_EDIT_KEYSTORE_PASSWORD=$SECRET_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "INTAKE_EDIT_KEY_ALIAS=$SECRET_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "INTAKE_EDIT_KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=persistent release key" >> "$GITHUB_ENV"
          else
            TEMP_PASSWORD='intake-edit-oneoff'
            TEMP_ALIAS='intake-edit-oneoff'
            keytool -genkeypair \
              -keystore "$INTAKE_EDIT_KEYSTORE_PATH" \
              -storepass "$TEMP_PASSWORD" \
              -keypass "$TEMP_PASSWORD" \
              -alias "$TEMP_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -dname "CN=Intake Edit ${RELEASE_TAG} One-Off Release, O=Shadow Monarch Books, C=PH"
            echo "INTAKE_EDIT_KEYSTORE_PASSWORD=$TEMP_PASSWORD" >> "$GITHUB_ENV"
            echo "INTAKE_EDIT_KEY_ALIAS=$TEMP_ALIAS" >> "$GITHUB_ENV"
            echo "INTAKE_EDIT_KEY_PASSWORD=$TEMP_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=one-off fallback key (persistent release secrets not configured)" >> "$GITHUB_ENV"
          fi
      - name: Set up Gradle 9.6
        if: steps.release_version.outputs.release_needed == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Test and build signed release APK
        if: steps.release_version.outputs.release_needed == 'true'
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Verify, name, and checksum APK
        if: steps.release_version.outputs.release_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APK"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          OUTPUT="intake-edit-${RELEASE_TAG}.apk"
          cp "$APK" "$OUTPUT"
          sha256sum "$OUTPUT" > "$OUTPUT.sha256"
      - name: Upload release APK artifact
        if: steps.release_version.outputs.release_needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: intake-edit-${{ env.RELEASE_TAG }}-release-apk
          path: |
            intake-edit-${{ env.RELEASE_TAG }}.apk
            intake-edit-${{ env.RELEASE_TAG }}.apk.sha256
          if-no-files-found: error
      - name: Publish GitHub release
        if: steps.release_version.outputs.release_needed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Intake Edit ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          body: |
            Android release for Intake Edit ${{ env.RELEASE_TAG }}.

            Version code: ${{ env.APP_VERSION_CODE }}
            Version name: ${{ env.RELEASE_VERSION }}
            Signing mode: ${{ env.SIGNING_MODE }}
          files: |
            intake-edit-${{ env.RELEASE_TAG }}.apk
            intake-edit-${{ env.RELEASE_TAG }}.apk.sha256
