name: Publish Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v0.5.1)
        required: true
        type: string

concurrency:
  group: android-release-${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INTAKE_EDIT_KEYSTORE_PATH: ${{ github.workspace }}/release-signing.jks
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate release tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$SECRET_KEYSTORE_PASSWORD" ] && [ -n "$SECRET_KEY_ALIAS" ] && [ -n "$SECRET_KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$INTAKE_EDIT_KEYSTORE_PATH"
            echo "INTAKE_EDIT_KEYSTORE_PASSWORD=$SECRET_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "INTAKE_EDIT_KEY_ALIAS=$SECRET_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "INTAKE_EDIT_KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            TEMP_PASSWORD='intake-edit-oneoff'
            TEMP_ALIAS='intake-edit-oneoff'
            keytool -genkeypair -keystore "$INTAKE_EDIT_KEYSTORE_PATH" -storepass "$TEMP_PASSWORD" -keypass "$TEMP_PASSWORD" -alias "$TEMP_ALIAS" -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Intake Edit ${RELEASE_TAG} One-Off Release, O=Shadow Monarch Books, C=PH"
            echo "INTAKE_EDIT_KEYSTORE_PASSWORD=$TEMP_PASSWORD" >> "$GITHUB_ENV"
            echo "INTAKE_EDIT_KEY_ALIAS=$TEMP_ALIAS" >> "$GITHUB_ENV"
            echo "INTAKE_EDIT_KEY_PASSWORD=$TEMP_PASSWORD" >> "$GITHUB_ENV"
          fi
      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify and name APK
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APK"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          cp "$APK" "intake-edit-${RELEASE_TAG}.apk"
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: intake-edit-${{ env.RELEASE_TAG }}-release-apk
          path: intake-edit-${{ env.RELEASE_TAG }}.apk
          if-no-files-found: error
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Intake Edit ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: intake-edit-${{ env.RELEASE_TAG }}.apk
