name: Publish Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v0.7.0)
        required: true
        type: string

concurrency:
  group: android-release-${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INTAKE_EDIT_KEYSTORE_PATH: ${{ github.workspace }}/release-signing.jks
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate release tag and app version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          RELEASE_VERSION="${RELEASE_TAG#v}"
          APP_VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)"
          APP_VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$APP_VERSION"
          test -n "$APP_VERSION_CODE"
          if [ "$APP_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match app versionName $APP_VERSION" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$APP_VERSION_CODE" >> "$GITHUB_ENV"
      - name: Prepare persistent release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$SECRET_KEYSTORE_PASSWORD" ] || [ -z "$SECRET_KEY_ALIAS" ] || [ -z "$SECRET_KEY_PASSWORD" ]; then
            echo "Persistent Android release signing secrets are required; refusing to create a one-off signed production release." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$INTAKE_EDIT_KEYSTORE_PATH"
          echo "INTAKE_EDIT_KEYSTORE_PASSWORD=$SECRET_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "INTAKE_EDIT_KEY_ALIAS=$SECRET_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "INTAKE_EDIT_KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Test and build signed release APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Verify, name, and checksum APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APK"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          OUTPUT="intake-edit-${RELEASE_TAG}.apk"
          cp "$APK" "$OUTPUT"
          sha256sum "$OUTPUT" > "$OUTPUT.sha256"
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: intake-edit-${{ env.RELEASE_TAG }}-release-apk
          path: |
            intake-edit-${{ env.RELEASE_TAG }}.apk
            intake-edit-${{ env.RELEASE_TAG }}.apk.sha256
          if-no-files-found: error
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Intake Edit ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          body: |
            Android release for Intake Edit ${{ env.RELEASE_TAG }}.

            Version code: ${{ env.APP_VERSION_CODE }}
            Version name: ${{ env.RELEASE_VERSION }}
            Signing mode: persistent release key
          files: |
            intake-edit-${{ env.RELEASE_TAG }}.apk
            intake-edit-${{ env.RELEASE_TAG }}.apk.sha256
