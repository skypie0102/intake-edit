  english: "The heroine of the main story. A first-year high school student. A bright, kind, beautiful girl with excellent grades. She has a strong sense of justice and hates deception and lies. No matter who she’s dealing with, she states her opinions clearly and directly. In truth, she’s a proud girl who’s quite fond of herself."
- locator: P7
