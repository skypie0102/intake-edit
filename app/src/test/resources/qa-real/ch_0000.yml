  english: "The protagonist of the main story. His given name has yet to be decided. A first-year high school student. Having spent all three years of middle school in a dorm at an all-boys school deep in the mountains, he’s become completely uncomfortable around girls. A gloomy, twisted misfit. He likes Shirasaka-san. Apparently, he likes her on a DNA level. He loves her obsessively."
- locator: P5
  source_japanese: ◎　白坂　雪乃　（シラサカ・ユキノ　十六歳）
