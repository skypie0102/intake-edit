endnotes:
- id: en-P30-01
  locator: P30
  content: "Omiai is a formal Japanese matchmaking custom in which families or intermediaries introduce prospective marriage partners, who then decide whether to proceed with marriage."
- id: en-P13-01
  locator: P13
  content: "Koshien is shorthand for Japan's national high-school baseball championship, played at Hanshin Koshien Stadium; reaching it is a major goal and cultural touchstone for school baseball teams."
- id: en-P15-01
  locator: P15
  content: "Japanese school baseball teams have traditionally expected players to wear very short or shaved hair, which is why the narrator treats Kenji's buzz cut as 'natural.'"
- id: en-P71-01
  locator: P71
  content: "Enjo kosai ('compensated dating') refers to paid dates, especially the Japanese phenomenon associated with teenage girls and older men; some such encounters involved sexual services."
- id: en-P79-01
  locator: P79
  content: "MEXT is the ministry’s official English acronym for Japan’s Ministry of Education, Culture, Sports, Science and Technology."
- id: en-P81-01
  locator: P81
  content: "Ikebana is the traditional Japanese art of flower arrangement, emphasizing form, balance, line, and the use of negative space."
