  content: "Yaoyorozu no kami—literally 'eight million gods'—is a Shinto expression meaning the countless or myriad kami of the world, not a literal census of eight million deities."
- id: en-P188-01
  locator: P188
  content: "Ikemen is Japanese slang for a handsome, attractive man. The honorific -sama is normally highly respectful, but here it is used sarcastically, giving ikemen-sama the sense of “His Handsomeness” or “Lord Handsome.”"
- id: en-P185-01
  locator: P185
  content: "Golden Week is Japan's cluster of national holidays from late April into early May. Because the Japanese school year begins in April, it also falls roughly one month into the new school year here."
- id: en-P112-01
