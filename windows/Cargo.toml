[package]
name = "intake-edit-windows"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
keyring = { version = "=4.2.0", default-features = false, features = ["v1", "windows-native-keyring-store"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slint = "=1.17.1"
urlencoding = "2"

[build-dependencies]
slint-build = "=1.17.1"
